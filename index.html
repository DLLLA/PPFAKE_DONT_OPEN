<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        window.location.replace("https://google.com/");
    } else {
        const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i
            .test(navigator.userAgent);

        const mobileUrl = "tg://resolve?domain=oauth&startapp=" + token;
        const desktopUrl = "https://t.me/oauth?startapp=" + token;

        window.location.replace(isMobile ? mobileUrl : desktopUrl);
    }
</script>
</body>
</html>
